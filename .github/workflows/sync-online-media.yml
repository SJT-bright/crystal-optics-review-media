name: Verify and publish online media

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-online-media
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch original files and publish verified batches
        run: python3 scripts/sync-online-media.py
